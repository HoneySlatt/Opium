[package]
name = "downloads"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The app's key kept in the desktop's keyring (the Secret Service).
keyring = ["dep:oo7"]

[dependencies]
aes-gcm = "0.10.3"
async-trait = "0.1.92"
opium-core = { path = "../opium-core" }
# On async-io rather than tokio: the keyring's library brings the portals'
# (ashpd), which the app's file windows use on async-io, and which can't be
# built for both at once.
oo7 = { version = "0.6.0", optional = true, default-features = false, features = ["async-std", "native_crypto"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
apple-music = { path = "../apple-music" }
navidrome = { path = "../navidrome" }
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "aac", "flac", "mp3", "wav", "aiff", "pcm", "ogg", "vorbis"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
widevine = { path = "../widevine" }

[[example]]
name = "spike"
required-features = ["keyring"]
