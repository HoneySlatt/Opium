[package]
name = "navidrome"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
getrandom = "0.4.3"
md-5 = "0.11.0"
opium-core = { path = "../opium-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["brotli", "gzip", "http2", "json", "multipart", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
