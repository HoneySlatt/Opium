[package]
name = "lyrics"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
music-core = { path = "../music-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
