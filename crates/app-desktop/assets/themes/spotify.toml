# Spotify's desktop app: rounded cards on black, Your Library on the left,
# Home and Search across the top, the player along the bottom, the song
# playing in a column on the right, and its green.
name = "Spotify"

[layout]
window = "cards"
sidebar = "library"
top_bar = "window"
player_bar = "docked"
panel = "side"
header = "banner"
lyrics = "page"
glow = "grey"
cards = "tiles"
favourite = "check"
now_playing = "cover"
rows = "stacked"

[colors]
light = false
base = "#121212"
mantle = "#282828"
crust = "#000000"
surface0 = "#1f1f1f"
surface1 = "#2a2a2a"
surface2 = "#3e3e3e"
overlay0 = "#6a6a6a"
overlay1 = "#a7a7a7"
text = "#ffffff"
subtext0 = "#b3b3b3"
accent = "#1ed760"
mauve = "#1db954"
red = "#f3727f"
green = "#1ed760"
yellow = "#ffa42b"
