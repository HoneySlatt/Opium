[package]
name = "app-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "music"
path = "src/main.rs"

[dependencies]
desktop = { path = "../desktop" }
music-core = { path = "../music-core" }
apple-music = { path = "../apple-music" }
soundcloud = { path = "../soundcloud" }
browser-signin = { path = "../browser-signin" }
async-trait = "0.1.92"
# SoundCloud's bot guard turns away changes from any client but a browser:
# these are sent as Chrome sends them.
wreq = "0.16.3"
wreq-util = "0.2.0"
local = { path = "../local" }
navidrome = { path = "../navidrome" }
lyrics = { path = "../lyrics" }
services = { path = "../services" }
player = { path = "../player" }
widevine = { path = "../widevine" }
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg", "image", "http"] }
motion = { path = "../motion" }
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
ehttp = "0.7.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# On async-io, as everything speaking to the desktop over D-Bus is here
# (the keyring, the portals of the window drawn by GPUI).
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "file_chooser"] }
async-io = "2.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
egui = "0.37"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
mpris-server = "0.11"
connect = { version = "0.1.0", path = "../connect" }
synced = { path = "../synced" }
downloads = { path = "../downloads", features = ["keyring"] }
