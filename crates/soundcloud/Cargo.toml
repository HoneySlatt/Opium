[package]
name = "soundcloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
browser-signin = { path = "../browser-signin" }
futures-util = "0.3.34"
music-core = { path = "../music-core" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "query", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time", "sync", "rt", "macros"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
