[package]
name = "apple-music"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
m3u8-rs = "6.0.1"
music-core = { path = "../music-core" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "fs", "rt", "macros"] }
tokio-tungstenite = "0.30.0"
url = "2.5.8"
widevine = { version = "0.1.0", path = "../widevine" }

[dev-dependencies]
player = { path = "../player" }
widevine = { path = "../widevine" }
