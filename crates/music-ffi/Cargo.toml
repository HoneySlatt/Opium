[package]
name = "music-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
# Generates the Kotlin bindings from the built library.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
apple-music = { path = "../apple-music" }
connect = { path = "../connect", features = ["ffi"] }
music-core = { path = "../music-core", features = ["ffi"] }
services = { path = "../services" }
navidrome = { path = "../navidrome" }
soundcloud = { path = "../soundcloud" }
lyrics = { path = "../lyrics" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
uniffi = { version = "0.32.2", features = ["tokio", "cli"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
rustls-platform-verifier = "0.7.1"
