[package]
name = "music-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
# Generates the Kotlin bindings from the built library.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
async-trait = "0.1.92"
# What uniffi runs the exports' futures on: with its own threads, not one
# alone, so that a library's parsing doesn't hold up a song's licence.
async-compat = { version = "0.2.6", features = ["multi-thread"] }
apple-music = { path = "../apple-music" }
connect = { path = "../connect", features = ["ffi"] }
downloads = { path = "../downloads" }
synced = { path = "../synced" }
music-core = { path = "../music-core", features = ["ffi"] }
services = { path = "../services" }
navidrome = { path = "../navidrome" }
soundcloud = { path = "../soundcloud" }
lyrics = { path = "../lyrics" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
uniffi = { version = "0.32.2", features = ["tokio", "cli"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
rustls-platform-verifier = "0.7.1"
