[package]
name = "connect"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
hex = "0.4.3"
hmac = "0.13.0"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
mdns-sd = "0.21.6"
music-core = { path = "../music-core" }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snow = "0.10.0"
spake2 = "0.4"
synced = { path = "../synced" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
uniffi = { version = "0.32.2", optional = true }

[features]
# The devices and what they say, as the Android app's Kotlin sees them.
ffi = ["dep:uniffi", "music-core/ffi"]
