# Runs the automated checks of the definition of done (AGENTS.md) on each push to main and on each
# pull request, in the same Nix shell that the agents use. Actions are pinned to commit SHAs, with
# the release they correspond to in a comment, as SlimeEngine's CI does.
name: CI

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A push or a pull request that changes only Markdown files builds and tests nothing: the links
# between the documents, the one check they need, run at every push in links.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  # Every Monday at 06:53 UTC, even without a push, so that a project at rest still learns of
  # changes in its dependencies and in CI's environment. The odd minute keeps off the hour; the
  # owner's other projects run at 06:17 and 06:41. A push cancels a scheduled run in progress
  # (concurrency, above).
  schedule:
    - cron: "53 6 * * 1"

permissions:
  contents: read

jobs:
  # Every check of scripts/check.sh, on Linux, the one platform the desktop app ships on.
  check:
    runs-on: ubuntu-24.04
    # A cold build compiles BoringSSL, FFmpeg's bindings, iroh and wgpu: about 11 minutes of the
    # script's work on a 16-core desktop, and 31 minutes on the first run here before the disk ran
    # out. The quality bar's budget is 20 minutes for a warm run, one whose cache hit; a cold run is
    # measured and recorded (docs/PLAN.md, M1.3). This limit only stops a hung run.
    timeout-minutes: 60
    # The same checks, in a smaller and faster build: the tests' binaries carry no debug info, which
    # they need only in a debugger, and nothing is kept for incremental builds, which a fresh runner
    # never reuses. The first run filled the runner's disk while linking the tests.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's preinstalled toolchains take most of its disk, and every tool used here comes
      # from Nix: removing them leaves room for the Nix store and the build.
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/julia*
          df -h /
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Cargo's downloads and the build, kept from one run to the next while the packages that
      # Cargo.lock pins and the toolchain that flake.lock pins are unchanged. The key is exact, with no
      # fallback, so an entry holds one build and never grows with stale artefacts; without debug
      # info and incremental data, `target` is a fraction of a local debug build's size.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
      # Without the flag, an incomplete flake.lock would be completed with an unpinned revision.
      - run: nix develop --no-update-lock-file --command scripts/check.sh
      # Saved even when a check fails, so that the next run starts warm; skipped on a hit, as an
      # entry cannot be overwritten.
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
  # The parsers of untrusted data fuzzed with `cargo fuzz`, in the nightly shell (ADR-0030): on the
  # weekly run only, as fuzzing takes time and finds little from one push to the next; the
  # deterministic mutation tests of `cargo test` run at every push. Five minutes a target, twelve
  # targets (cenc's and apple-music's): an hour of fuzzing, its builds besides; the limit only
  # stops a hung run.
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop .#fuzz --no-update-lock-file --command scripts/fuzz.sh 300
      # A crash's input, to reproduce it with `cargo fuzz run <target> <file>`.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/*/fuzz/artifacts/
  # The phone's core (`scripts/check.sh android`), in the Android shell. The shell's SDK is Google's,
  # unfree, so cache.nixos.org holds none of it but an old `sdk-tools` archive: every run downloads
  # the rest from Google again, and fails when a version nixpkgs asks for is missing from Google's
  # server, as on 2026-11-04 and 2026-11-05 (docs/measurements.md, M1.5).
  android:
    runs-on: ubuntu-24.04
    # A cold run is measured in docs/measurements.md; this limit only stops a hung run.
    timeout-minutes: 60
    # As in the check job.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner leaves 14 GB free and the job uses 12, the SDK's archives and what they unpack
      # to (measured on 2026-11-07): too close, so the disk is freed as in the check job.
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/julia*
          df -h /
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # As in the check job, but `target-android`, the folder of scripts/check.sh android.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-android
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
      - run: nix develop .#android --no-update-lock-file --command scripts/check.sh android
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-android
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # The disk the job used, to compare with the 14 GB the runner leaves free.
      - if: always()
        run: df -h /
