# Checks the documents, at every push to main and on every pull request, documents only or not:
# ci.yml skips a push of documents only, and this check is the one they need. It runs
# `scripts/check.sh docs`, the sizes of AGENTS.md and docs/PLAN.md and the links between the
# Markdown files, with lychee from the nixpkgs that flake.lock pins, without building the whole
# development shell. Actions are pinned to commit SHAs, as in ci.yml.
name: Documents

concurrency:
  group: documents-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix shell --inputs-from . nixpkgs#lychee --command scripts/check.sh docs
