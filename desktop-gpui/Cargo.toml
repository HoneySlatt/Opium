[package]
name = "music-gpui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Music's desktop window drawn by GPUI, on the same workings as the egui one"

# A workspace of its own: GPUI pins dependencies that egui's can't share a
# lockfile with (gpui_web's `unicode-properties = "=0.1.3"` against epaint's
# `^0.1.4`), so until the window drawn by egui goes, the two build apart.
[workspace]

[[bin]]
name = "music-gpui"
path = "src/main.rs"

[dependencies]
desktop = { path = "../crates/desktop" }
music-core = { path = "../crates/music-core" }
navidrome = { path = "../crates/navidrome" }
synced = { path = "../crates/synced" }
downloads = { path = "../crates/downloads" }
serde_json = "1.0.154"
async-channel = "2.5"
toml = "1.1.8"
ehttp = "0.7.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# GPUI from Music's fork of Zed, beside this repository for now (branch
# `music`): published as its own repository once it carries patches.
gpui = { path = "../../gpui/crates/gpui" }
gpui_platform = { path = "../../gpui/crates/gpui_platform", features = ["wayland"] }

[profile.release]
lto = "thin"
codegen-units = 1
